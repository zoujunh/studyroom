<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="考研工作台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>考研备考工作台</title>
<meta name="description" content="考研备考工作台：倒计时、计划、四科进度、真题、错题、模考、资料、复盘，一屏管理。数据可自定义，全部存在本机。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/icon/favicon.svg">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <p class="brand__eyebrow">KAOYAN WORKBENCH</p>
      <h1 class="brand__title">考研备考工作台</h1>
      <p class="brand__sub" id="brandSub">今天也按计划走 · 一屏看清任务与分数</p>
    </div>
    <div class="topbar__side">
      <div class="topbar__quick" id="quickStats"></div>
      <div class="topbar__btns">
        <button class="icon-btn icon-btn--big" data-act="go" data-page="settings" title="设置" aria-label="设置" id="gearBtn"></button>
        <button class="icon-btn icon-btn--big" data-act="toggle-theme" title="切换深色模式" aria-label="切换深色模式" id="themeBtn"></button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main class="main" id="view"></main>

  <footer class="foot">
    <span>数据保存在本机浏览器（localStorage）· <button class="link" data-act="go" data-page="settings">设置与备份</button></span>
    <span class="foot__acts">
      <button class="link" data-act="export">导出备份</button>
      <button class="link" data-act="import">导入</button>
    </span>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal__mask" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" id="modalPanel"></div>
</div>

<div class="toasts" id="toasts"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="assets/js/util.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
